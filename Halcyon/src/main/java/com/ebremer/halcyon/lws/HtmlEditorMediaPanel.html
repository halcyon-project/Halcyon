<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <div class="lws-html-editor">
        <p wicket:id="error" style="color:#a33"></p>
        <form wicket:id="form">
            <div wicket:id="rte"></div>
            <p>
                <button wicket:id="save" type="submit">Save</button>
                <span wicket:id="message" style="margin-left:.75em"></span>
            </p>
        </form>
    </div>
</wicket:panel>
