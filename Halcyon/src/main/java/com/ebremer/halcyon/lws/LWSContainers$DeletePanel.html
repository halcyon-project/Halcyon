<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <h4>Delete</h4>
    <div class="uri" wicket:id="target"></div>
    <p class="lws-warn" wicket:id="warning"></p>
    <form wicket:id="form">
        <div class="lws-actions">
            <button class="lws-save lws-danger" wicket:id="delete" type="submit">Delete</button>
            <span class="lws-msg" wicket:id="message"></span>
        </div>
    </form>
</wicket:panel>
