<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <h4 wicket:id="vname">Preview</h4>
    <div class="uri" wicket:id="vuri"></div>
    <div class="lws-vbar">
        <span class="lws-vmedia" wicket:id="vmedia"></span>
        <form wicket:id="vform" style="display:inline">
            <label>open with <select wicket:id="openWith"></select></label>
        </form>
        <a wicket:id="vopen" target="_blank" rel="noopener"
           title="Open directly from the storage in a new tab">open ↗</a>
    </div>
    <div wicket:id="vcontent"></div>
    <div class="lws-note" wicket:id="vnote"></div>
</wicket:panel>
