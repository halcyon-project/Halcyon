<html>
    <body>
        <wicket:extend>
            <style>
                body { font-family: Arial, sans-serif; color: #333; background-color: #f4f4f9; }
                .stk { margin: 14px; font-size: 14px; color: #333; max-width: 1200px; }
                .stk h3 { color: #0000ab; margin: 8px 0; }
                .stk table { border-collapse: collapse; background: #fff; border: 1px solid #ddd;
                             border-radius: 4px; width: 100%; }
                .stk th, .stk td { text-align: left; padding: 6px 12px; border-bottom: 1px solid #eee;
                                   font-size: 13px; }
                .stk th { color: #0000ab; }
                .stk td.uri { font-family: monospace; color: #888; word-break: break-all; }
                .stk a { color: #0000ab; text-decoration: none; }
                .stk a:hover { text-decoration: underline; }
                .stk a.del { color: #b00020; }
                .stk .none { color: #888; font-style: italic; margin: 10px 0; }
                .stk .msg { margin: 8px 0; color: #0000ab; }
            </style>
            <div class="stk">
                <h3>Stacks</h3>
                <div class="none" wicket:id="none"></div>
                <table>
                    <tr><th>Name</th><th>URI</th><th>Storage</th><th></th></tr>
                    <tr wicket:id="rows">
                        <td><a wicket:id="view"><span wicket:id="name"></span></a></td>
                        <td class="uri" wicket:id="uri"></td>
                        <td wicket:id="storage"></td>
                        <td><a wicket:id="delete" class="del">Delete</a></td>
                    </tr>
                </table>
                <div class="msg" wicket:id="message"></div>
            </div>
        </wicket:extend>
    </body>
</html>
