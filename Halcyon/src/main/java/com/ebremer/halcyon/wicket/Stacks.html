<html>
    <body>
        <wicket:extend>
            <style>
                body { font-family: Arial, sans-serif; color: #333; background-color: #f4f4f9; }
                .img-list { margin: 14px; font-size: 14px; max-width: 1300px; }
                .img-list h3 { color: #0000ab; margin: 8px 0; }
                .img-list table { border-collapse: collapse; background: #fff; border: 1px solid #ddd;
                                  border-radius: 4px; width: 100%; font-size: 13px; }
                .img-list th, .img-list td { text-align: left; padding: 6px 12px;
                                             border-bottom: 1px solid #eee; }
                .img-list th { color: #0000ab; }
                .img-list a { color: #0000ab; text-decoration: none; }
                .img-list a:hover { text-decoration: underline; }
            </style>
            <div class="img-list">
                <h3>Stacks</h3>
                <table wicket:id="stacks"></table>
            </div>
        </wicket:extend>
    </body>
</html>
