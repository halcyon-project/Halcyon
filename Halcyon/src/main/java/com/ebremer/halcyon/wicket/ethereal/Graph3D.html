<!DOCTYPE html>
<html lang="en">
<wicket:head>
  <style> body { margin: 0; } </style>
  <!--
    L18: served from ourselves, not from unpkg. This was
    <script src="//unpkg.com/3d-force-graph"></script> — an UNVERSIONED,
    protocol-relative URL, so /threed executed whatever "latest" unpkg happened
    to be serving at page load, from a third party, with no integrity check and
    no offline story. The vendored copies under /graph3d/ are the exact versions
    unpkg resolved to when they were pinned (3d-force-graph 1.80.0,
    three-spritetext 1.10.0, three 0.185.1), so behaviour is unchanged.

    NOTE: these deliberately do NOT reuse the shared /threejs/ copy — that one is
    three r160 and is what Zephyr2/Zephyr3 are built against, while
    3d-force-graph 1.80.0 declares three ">=0.179 <1". Pointing this page at
    /threejs/ would satisfy L18 and quietly break the graph.
  -->
  <script src="/graph3d/3d-force-graph.min.js"></script>
  <style>
    .node-label {
      font-size: 12px;
      padding: 1px 4px;
      border-radius: 4px;
      background-color: rgba(0,0,0,0.5);
      user-select: none;
    }
    .column {
        float: left;
        width: 20%;  
    }
    /* Clear floats after the columns */
    .row:after {
        content: "";
        display: table;
        clear: both;
    }
  </style>
</wicket:head>

<body>
  <wicket:extend>
    <div class="row">
        <div class="column">
            <div class="row" style="margin: 6px 0; font-size: 14px;">
                Graph of <b><span wicket:id="which"></span></b><br/>
                Store: <a wicket:id="classic">Halcyon (tdb2)</a> ·
                <a wicket:id="lws">W3C LWS (lws-tdb2)</a>
            </div>
            <div class="row">
                <input type="submit" wicket:id="button"/>
            </div>
            <div class="row">
                <div wicket:id="chosen"></div>
            </div>
        </div>
        <div class="column">
            <div id="3d-graph"></div>
        </div>
    </div> 

  <script type="importmap" wicket:id="cspImportMap">{ "imports": { "three": "/graph3d/three.module.js" }}</script>
  <script type="module" wicket:id="cspModule">
    import SpriteText from "/graph3d/three-spritetext.mjs";   
    const Graph = ForceGraph3D();
    window.Graph = Graph
    (document.getElementById('3d-graph'))
        .nodeLabel('id')
        .nodeAutoColorBy('group')
        .onNodeDragEnd(node => {
            node.fx = node.x;
            node.fy = node.y;
            node.fz = node.z;
        })
      //.nodeThreeObject(node => {
        //const nodeEl = document.createElement('div');
        //nodeEl.textContent = node.id;
        //nodeEl.style.color = node.color;
        //nodeEl.className = 'node-label';
        //return new THREE.CSS2DObject(nodeEl);
      //})
      .linkThreeObject(link => {
          const sprite = new SpriteText(`${link.predicate}`);
          sprite.color = 'lightgrey';
          sprite.textHeight = 1.5;
          return sprite;
       })
        .linkPositionUpdate((sprite, { start, end }) => {
          const middlePos = Object.assign(...['x', 'y', 'z'].map(c => ({
           [c]: start[c] + (end[c] - start[c]) / 2
          })));
          Object.assign(sprite.position, middlePos);
        })
       .linkThreeObjectExtend(true)
      .nodeThreeObjectExtend(true);
    Graph.d3Force('charge').strength(-120);
        
  </script>
  </wicket:extend>
</body>
</html>
