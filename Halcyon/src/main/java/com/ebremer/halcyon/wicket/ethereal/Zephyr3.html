<!DOCTYPE html>
<html lang="en">
<wicket:head>
  <style> body {
    margin: 0;
  } </style>
  <link href="/zephyr/fontawesome-free-6.6.0-web/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/zephyr/css/main.css">
  <script src="/zephyr/js/jsts.min.js"></script>
</wicket:head>
<body>

<wicket:extend>
<div id="output"></div>
 <script type="importmap">
    {
        "imports": {
            "three": "/threejs/build/three.module.js",
            "three/addons/": "/threejs/examples/jsm/",
            "zephyr": "/zephyr/zephyr.js",
            "zephyrRDF": "/zephyr/zephyrRDF.js"
        }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import Stats from 'three/addons/libs/stats.module.js';
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
    import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
    import * as ZEPHYR from 'zephyr';
    import * as ZEPHRDF from 'zephyrRDF';
    import { toolbar } from '/zephyr/toolbar.js';
    import * as rdf from '/rdflib/rdflib.min.js';
    import { createButton, turnOtherButtonsOff } from "/zephyr/helpers/elements.js";

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.updateProjectionMatrix();
    }
    
    const store = $rdf.graph();
    const fetcher = new $rdf.Fetcher(store);
    const timeout = 5000; // 5 seconds timeout
    const endpoint = 'https://localhost:8888/sparql';
    const baseURI = 'https://localhost:8888/ldp/utah/HnE/Stack2/';
        
    window.onload = function() {
        ZEPHRDF.ParseTTL(scenegraph, store, baseURI);
        ZEPHRDF.DumpTTL(store, baseURI);
        var ha = ZEPHRDF.ListElements(store, baseURI);
        ZEPHRDF.ListImages(store, baseURI);
        ha.forEach(e => {               
            we.add(e);
        });
    };

    THREE.Cache.enabled = true;
    const scene = new THREE.Scene();
    const we = new ZEPHRDF.WE(scene,store);

    const camera = window._camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 1, 80000);
    camera.position.z = 71000;

    const originalZ = camera.position.z;
    camera.lookAt(new THREE.Vector3(0, 0, 0));
    scene.add(camera);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      preserveDrawingBuffer: true // Preserve the drawing buffer to capture the image later
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    window.addEventListener('resize', onWindowResize);

    let controls = new TrackballControls(camera, renderer.domElement);
    controls.dynamicDampingFactor = 0.2; // To offer a smooth yet responsive control feel
    ZEPHYR.DrawAxis(scene);
    console.log(options);
    
    // Initialize toolbar with config
    toolbar(scene, camera, renderer, controls, originalZ, config);
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();    
    

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</wicket:extend>
</body>
</html>
