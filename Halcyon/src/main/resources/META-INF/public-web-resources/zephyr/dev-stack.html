<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zephyr stack dev harness</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #dev-controls {
      position: fixed; top: 0; left: 0; z-index: 2000; width: 360px; max-height: 100vh;
      overflow: auto; background: rgba(255,255,255,.95); padding: 8px; box-sizing: border-box;
      border-right: 1px solid #ccc; font-size: 12px;
    }
    #dev-controls textarea { width: 100%; height: 220px; font-family: monospace; font-size: 11px; }
    #dev-controls input[type=text] { width: 100%; box-sizing: border-box; }
    #dev-controls button { margin-top: 6px; }
    #dev-status { color: #b00020; white-space: pre-wrap; }
    .hint { color: #555; }
  </style>
  <link href="/zephyr/fontawesome-free-6.6.0-web/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/zephyr/css/main.css">
  <script src="/zephyr/js/jsts.min.js"></script>
</head>
<body>
  <div id="dev-controls">
    <strong>Zephyr stack dev harness</strong>
    <p class="hint">Sign in to <a href="/" target="_blank">Halcyon</a> in this browser first —
      tiles are served without a session, but annotation save/fetch and stack
      persistence need one (they fail with sign-in redirects otherwise).
      Edit the base URI + Turtle, then Build.</p>
    <label>Base URI</label>
    <input id="dev-base" type="text" value="https://localhost:8888/lws/tcga/coad/">
    <label>Stack (Turtle)</label>
    <textarea id="dev-ttl"></textarea>
    <button id="dev-build" class="annotationBtn">Build stack</button>
    <button id="dev-flat" class="annotationBtn">Load utah demo</button>
    <button id="dev-fetch" class="annotationBtn">Fetch named graph</button>
    <div id="dev-status"></div>
  </div>
  <div id="output"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "/threejs/build/three.module.js",
        "three/addons/": "/threejs/examples/jsm/",
        "zephyr": "/zephyr/zephyr.js",
        "zephyrRDF": "/zephyr/zephyrRDF.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
    import * as ZEPHYR from 'zephyr';
    import { ZephyrViewer } from '/zephyr/viewer.js';
    import { installDeepLinks } from '/zephyr/helpers/deepLink.js';
    import { toolbar } from '/zephyr/toolbar.js';
    import * as rdf from '/rdflib/rdflib.min.js';   // side effect: sets window.$rdf
    import { loadStackGraph } from '/zephyr/scene/stackPersistence.js';

    // Auth/config stubs (a real page injects these from the server session).
    window.token = window.token || '';
    window.useriri = window.useriri || 'urn:dev:user';
    window.userName = window.userName || 'dev';
    const config = {
      toolbarEnabled: true,
      tools: {
        colorPalette: { enabled: true }, freeDrawing: { enabled: true },
        rectangle: { enabled: true }, rectangleAlt: { enabled: false },
        ellipse: { enabled: true }, polygon: { enabled: true },
        hollowBrush: { enabled: true }, grid: { enabled: false },
        edit: { enabled: true }, label: { enabled: true }, ruler: { enabled: false },
        screenCapture: { enabled: true }, crosshairs: { enabled: false },
        save: { enabled: true }, fetchAnnotations: { enabled: true },
        zoomControl: { enabled: false }, brightContrast: { enabled: false },
        getImageName: { enabled: false },
        scaleBar: { enabled: true }, minimap: { enabled: true },
        compare: { enabled: true }, featureInfo: { enabled: true }
      }
    };

    const S = document.getElementById('dev-status');
    const status = (m) => { S.textContent = m; console.log('[dev]', m); };

    const COAD = `@prefix zeph: <https://halcyon.is/zephyr/ns/> .
<> a zeph:Stack ; zeph:layers (
  [ zeph:src [ a zeph:Stack ; zeph:layers (
      [ zeph:src <TCGA-CM-5863-01Z-00-DX1.2dceed07-9373-4103-be16-533dac9f283b.svs> ]
      [ zeph:src <coad_TCGA-CM-5863-01Z-00-DX1.2dceed07-9373-4103-be16-533dac9f283b.svs.ttl.h5> ]
  ) ] ]
  [ zeph:src [ a zeph:Stack ; zeph:layers (
      [ zeph:src <TCGA-CM-6162-01Z-00-DX1.806a99a3-cda2-4dde-8d13-d22912b44d49.svs> ]
      [ zeph:src <coad_TCGA-CM-6162-01Z-00-DX1.806a99a3-cda2-4dde-8d13-d22912b44d49.svs.ttl.h5> ]
  ) ] ]
) .`;

    // The utah HnE/Stack2 demo: 7 co-registered tiles under /lws/utah/HnE/Stack2/.
    const UTAH_BASE = 'https://localhost:8888/lws/utah/HnE/Stack2/';
    const FLAT = `@prefix zeph: <https://halcyon.is/zephyr/ns/> .
<> a zeph:Stack ; zeph:layers (
  [ zeph:src <Stack0.tif> ] [ zeph:src <Stack1.tif> ] [ zeph:src <Stack2.tif> ]
  [ zeph:src <Stack3.tif> ] [ zeph:src <Stack4.tif> ] [ zeph:src <Stack5.tif> ]
  [ zeph:src <Stack6.tif> ]
) .`;

    document.getElementById('dev-ttl').value = COAD;

    // ---- three.js scaffold (mirrors Zephyr3.html) --------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 1, 5000000);
    camera.position.z = 100000;
    camera.lookAt(new THREE.Vector3(0, 0, 0));
    scene.add(camera);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.updateProjectionMatrix();
    });

    // 2D slide navigation (zoom-to-cursor) by default; append
    // ?controls=trackball for free 3D rotation (z-spread inspection).
    const use3d = new URLSearchParams(location.search).get('controls') === 'trackball';
    const controls = use3d
      ? new TrackballControls(camera, renderer.domElement)
      : new ZEPHYR.SlideControls(camera, renderer.domElement);
    if (controls.dynamicDampingFactor !== undefined) controls.dynamicDampingFactor = 0.2;
    ZEPHYR.DrawAxis(scene);
    toolbar(scene, camera, renderer, controls, camera.position.z, config);

    // Composition root: owns the registry, config, render loop and teardown.
    const viewer = new ZephyrViewer({
      scene, camera, renderer, controls,
      config: { token: window.token, useriri: window.useriri, userName: window.userName }
    });

    document.addEventListener('zephyr:stackready', (e) => {
      let box = e.detail && e.detail.bounds;
      if (!box || box.isEmpty()) box = new THREE.Box3().setFromObject(scene);
      if (box.isEmpty()) return;
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y) || 1000;
      const dist = maxDim * 1.2 + size.z;
      camera.near = Math.max(1, dist / 2000);
      camera.far = (dist + size.z) * 8 + maxDim * 4;
      camera.position.set(center.x, center.y, center.z + dist);
      camera.up.set(0, 1, 0);
      camera.lookAt(center);
      camera.updateProjectionMatrix();
      if (controls.target) controls.target.copy(center);
      controls.update();
      if (controls.saveState) controls.saveState(); // Reset View returns here
      ZEPHYR.invalidate();
      status('Stack ready. Layers: ' + (e.detail.registry ? e.detail.registry.list().length : '?'));
    });

    function build(ttl, base) {
      try {
        // viewer.clear() cancels outstanding tile fetches and frees the old
        // stack's GPU/bitmap memory before the rebuild.
        viewer.clear();
        viewer.buildStack(ttl, base);
        status('Building… layers registered: ' + viewer.registry.list().length);
      } catch (err) {
        status('Build error: ' + (err && err.message ? err.message : err));
        console.error(err);
      }
    }

    document.getElementById('dev-build').addEventListener('click', () =>
      build(document.getElementById('dev-ttl').value, document.getElementById('dev-base').value.trim()));
    document.getElementById('dev-flat').addEventListener('click', () => {
      document.getElementById('dev-base').value = UTAH_BASE;
      document.getElementById('dev-ttl').value = FLAT;
      build(FLAT, UTAH_BASE);
    });
    document.getElementById('dev-fetch').addEventListener('click', async () => {
      const uri = document.getElementById('dev-base').value.trim();
      status('CONSTRUCTing named graph <' + uri + '>…');
      try {
        const ttl = await loadStackGraph(uri);
        document.getElementById('dev-ttl').value = ttl && ttl.trim() ? ttl : '# (named graph is empty)';
        if (ttl && ttl.trim()) build(ttl, uri);
        else status('Named graph <' + uri + '> is empty — Save a stack there first.');
      } catch (err) {
        status('Fetch failed (needs an authenticated session): ' + err.message);
      }
    });

    // Render on demand: frames only happen while something is dirty (camera
    // motion, tile arrivals, tool input); the rAF suspends when idle.
    viewer.startLoop();

    // Shareable URLs: hash tracks camera pose + active/hidden layers, and is
    // applied after stack framing (so a pasted link wins).
    installDeepLinks({ camera, controls });

    // Auto-build the default stack.
    build(COAD, document.getElementById('dev-base').value.trim());
  </script>
</body>
</html>
